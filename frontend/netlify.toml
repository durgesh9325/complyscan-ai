[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# API proxy -> Railway backend
#
# IMPORTANT: niche apna Railway URL daalo (https:// wale ke bina trailing slash)
# Example: https://complyscan-api-production.up.railway.app
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-RAILWAY-URL.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback - saare client-side routes index.html serve karein
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
