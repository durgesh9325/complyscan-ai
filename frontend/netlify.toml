[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# API proxy -> Railway backend
#
# Frontend relative /api/... calls ko Railway backend par forward karta hai,
# isliye CORS setup ki zarurat nahi padti.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "https://complyscan-ai-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback - saare client-side routes index.html serve karein
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
